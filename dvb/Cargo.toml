[package]
name = "televido-dvb"
version = "0.6.0-beta.1"
edition = "2021"
publish = false

[dependencies]
eyre = "0.6.14"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.138"
time = { version = "0.3.37", features = ["local-offset"] }
tokio = { version = "1.43.0", features = ["fs", "time", "rt-multi-thread", "macros", "sync", "net", "io-util"] }
tracing = "0.1.41"
url = "2.5.8"
